[workspace]
resolver = "2"
members = [
    "crates/bench_metrics",
    "crates/collections",
    "crates/gpui",
    "crates/gpui_apple",
    "crates/gpui_ios",
    "crates/gpui_linux",
    "crates/gpui_macos",
    "crates/gpui_macros",
    "crates/gpui_platform",
    "crates/gpui_shared_string",
    "crates/gpui_util",
    "crates/gpui_web",
    "crates/gpui_wgpu",
    "crates/gpui_windows",
    "crates/http_client",
    "crates/refineable",
    "crates/http_client_tls",
    "crates/reqwest_client",
    "crates/scheduler",
    "crates/sum_tree",
    "crates/util_macros",
    "crates/zlog",
    "crates/ztracing",
    "crates/ztracing_macro",
    "tooling/perf",
    "crates/refineable/derive_refineable",
]

# Kept identical to upstream zed-industries/zed.
[workspace.package]
publish = false
edition = "2024"

[workspace.dependencies]

#
# Workspace member crates
#
gpui_util = { path = "crates/gpui_util" }
collections = { path = "crates/collections", version = "0.1.0" }
bench_metrics = { path = "crates/bench_metrics" }
gpui_macros = { path = "crates/gpui_macros" }
gpui_shared_string = { path = "crates/gpui_shared_string" }
http_client = { path = "crates/http_client" }
refineable = { path = "crates/refineable" }
scheduler = { path = "crates/scheduler" }
sum_tree = { path = "crates/sum_tree" }
gpui_platform = { path = "crates/gpui_platform", default-features = false }
util_macros = { path = "crates/util_macros" }
reqwest_client = { path = "crates/reqwest_client" }
gpui_web = { path = "crates/gpui_web", default-features = false }
gpui = { path = "crates/gpui", default-features = false }
gpui_apple = { path = "crates/gpui_apple" }
gpui_wgpu = { path = "crates/gpui_wgpu" }
gpui_macos = { path = "crates/gpui_macos", default-features = false }
gpui_ios = { path = "crates/gpui_ios" }
gpui_windows = { path = "crates/gpui_windows", default-features = false }
gpui_linux = { path = "crates/gpui_linux", default-features = false }
derive_refineable = { path = "crates/refineable/derive_refineable" }
http_client_tls = { path = "crates/http_client_tls" }
ztracing = { path = "crates/ztracing" }
zlog = { path = "crates/zlog" }
perf = { path = "tooling/perf", default-features = false }
ztracing_macro = { path = "crates/ztracing_macro" }

#
# External crates
#
anyhow = "1.0.86"
criterion = { version = "0.8.2", features = ["html_reports"] }
libc = "0.2"
perf-event = { package = "perf-event2", version = "0.7.4" }
indexmap = { version = "2.7.0", features = ["serde"] }
rustc-hash = "2.1.0"
accesskit = { version = "0.24.0", features = ["enumn"] }
async-task = "4.7"
backtrace = "0.3"
bitflags = "2.6.0"
derive_more = { version = "2.1", features = ["deref", "deref_mut", "from_str"] }
etagere = "0.2"
futures = "0.3.34"
futures-concurrency = "7.7.1"
icu_segmenter = { version = "2.3.0", default-features = false, features = ["compiled_data"] }
image = { version = "0.25.1", default-features = false, features = ["bmp", "dds", "exr", "ff", "gif", "hdr", "ico", "jpeg", "png", "pnm", "qoi", "rayon", "tga", "tiff", "webp"] }
inventory = "0.3.19"
itertools = "0.14.0"
log = { version = "0.4", default-features = false, features = ["std"] }
parking_lot = "0.12.1"
postage = { version = "0.5", default-features = false }
proptest = { version = "1.12.0", features = ["attr-macro"] }
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
profiling = "1"
rand = { version = "0.9", default-features = false, features = ["std", "std_rng", "os_rng"] }
raw-window-handle = "0.6"
regex = { version = "1.5", default-features = false, features = ["std", "perf"] }
resvg = { version = "0.46.0", default-features = false, features = ["text", "system-fonts", "memmap-fonts", "raster-images"] }
usvg = { version = "0.46.0", default-features = false }
schemars = { version = "1.0", default-features = false, features = ["std", "indexmap2"] }
serde = { version = "1.0", features = ["rc"] }
serde_json = { version = "1.0.144", features = ["preserve_order", "raw_value"] }
slotmap = "1.0.6"
smallvec = { version = "1.6", features = ["union", "const_new"] }
stacksafe = "1.0"
strum = { version = "0.28", features = ["derive"] }
taffy = { version = "=0.15.0", default-features = false }
thiserror = "2.0.12"
unicode-segmentation = "1.10"
hdrhistogram = { version = "7", default-features = false }
spin = { version = "0.10", default-features = false, features = ["mutex", "spin_mutex", "lock_api"] }
url = "2.2"
uuid = { version = "1.1", features = ["serde"] }
web-time = "1.1.0"
heapless = "0.9.2"
env_logger = "0.11"
async-channel = { version = "2.5", default-features = false }
pollster = "0.4.0"
async-tungstenite = "0.33"
smol = "2.0"
wasm-bindgen = "0.2.120"
web-sys = "0.3"
objc2-core-foundation = { version = "=0.3.2", default-features = false }
objc2-core-video = { version = "=0.3.2", default-features = false, features = ["CVBuffer", "CVImageBuffer"] }
objc2 = "0.6"
scap = { git = "https://github.com/zed-industries/scap", rev = "b5c86ec58dd4b6b7732bf6ac8be03d6b1f190a82", default-features = false, package = "zed-scap", version = "0.0.8-zed" }
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_IO", "Win32_System_LibraryLoader", "Win32_System_Ole", "Win32_System_Threading", "Win32_System_Variant", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_Shell_PropertiesSystem", "Win32_UI_WindowsAndMessaging"] }
block2 = "0.6"
core-foundation = "0.10"
core-foundation-sys = "0.8.6"
core-graphics = "0.24"
core-text = "21"
dispatch2 = { version = "0.3", default-features = false, features = ["std"] }
font-kit = { git = "https://github.com/zed-industries/font-kit", rev = "94b0f28166665e8fd2f53ff6d268a14955c82269", package = "zed-font-kit", version = "0.14.1-zed", default-features = false }
mach2 = "0.6"
objc2-core-graphics = { version = "=0.3.2", default-features = false, features = ["CGDirectDisplay"] }
objc2-core-text = { version = "0.3.2", default-features = false, features = ["std", "CTFont", "CTFontDescriptor"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["NSArray", "NSAttributedString", "NSBundle", "NSCoder", "NSData", "NSDate", "NSDictionary", "NSEnumerator", "NSError", "NSGeometry", "NSNull", "NSObjCRuntime", "NSObject", "NSProcessInfo", "NSRange", "NSRunLoop", "NSSet", "NSString", "NSURL", "NSValue", "objc2-core-foundation", "std"] }
